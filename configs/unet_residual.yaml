run_name: unet_residual
seed: 42

data:
  train_root: datasets/train_data
  test_root: datasets/test_data
  img_size: [252, 378]
  val_fraction: 0.15

model:
  name: unet_residual
  in_channels: 3
  out_channels: 1
  base_channels: 32
  depth: 4

loss:
  bce_weight: 0.5
  dice_weight: 0.5

training:
  epochs: 80
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 4

checkpoint_dir: checkpoints
